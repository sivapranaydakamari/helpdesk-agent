services:
  it-helpdesk-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TOKEN_BUDGET_LIMIT=${TOKEN_BUDGET_LIMIT:-4000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
